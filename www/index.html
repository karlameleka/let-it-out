<!doctype html>
<!--
  This file is never actually shown — capacitor.config.ts points the native
  shell at the live site (server.url) on launch, not at these local files.
  Capacitor still requires a webDir to exist at build time, and the native
  WebView briefly falls back to whatever's here if the remote URL can't be
  reached at all (e.g. no network on first launch, before the app's own
  offline page can load), so this is a minimal, on-brand placeholder rather
  than an empty file.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Let It Out</title>
    <style>
      html, body {
        height: 100%;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #1e5b73;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      p {
        opacity: 0.85;
        font-size: 15px;
      }
    </style>
  </head>
  <body>
    <p>Connecting to Let It Out&hellip;</p>
  </body>
</html>
